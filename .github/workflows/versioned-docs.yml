name: Deploy Versioned Documentation

on:
  push:
    branches: ["0.3.3-stable", "0.3.3", "0.4.1-beta", "0.4"]
    paths:
      - "website/**"
      - ".github/workflows/versioned-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  CHECKMATE_DOCS_LATEST: v0.3.3-stable

jobs:
  build:
    name: Build versioned site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Prepare the latest release and archived versions
        run: |
          mkdir -p "$RUNNER_TEMP/checkmate-release" "$RUNNER_TEMP/checkmate-v0.4.1-beta" "$RUNNER_TEMP/checkmate-v0.4-alpha"
          git archive "$CHECKMATE_DOCS_LATEST" website | tar -x -C "$RUNNER_TEMP/checkmate-release"
          git archive v0.4.1-beta website | tar -x -C "$RUNNER_TEMP/checkmate-v0.4.1-beta"
          git archive v0.4-alpha website | tar -x -C "$RUNNER_TEMP/checkmate-v0.4-alpha"
          node website/scripts/prepare-published-site.mjs \
            "$RUNNER_TEMP/checkmate-release/website" \
            "$RUNNER_TEMP/checkmate-site" \
            "v0.4.1-beta=$RUNNER_TEMP/checkmate-v0.4.1-beta/website" \
            "v0.4-alpha=$RUNNER_TEMP/checkmate-v0.4-alpha/website"

      - name: Install dependencies and build
        working-directory: ${{ runner.temp }}/checkmate-site
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/checkmate-site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
