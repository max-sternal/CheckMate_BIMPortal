name: CI

on:
  push:
    branches: ["0.4", "0.4.1-beta"]
  pull_request:
    branches: ["0.4", "0.4.1-beta"]
  workflow_dispatch:

jobs:
  ts-tests-and-build:
    name: TypeScript Tests & Build (IFClite, CLI, MCP, Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest test suites
        run: pnpm test

      - name: Typecheck & build all packages
        run: pnpm build

  docs-build:
    name: Build Astro Starlight Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build documentation site
        working-directory: website
        run: npm run build
