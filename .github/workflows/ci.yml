name: CI

on:
  push:
    branches: ["main", "0.3.1", "0.3.2", "0.3.3", "0.3.3-stable", "webView"]
  pull_request:
    branches: ["main", "0.3.1", "0.3.2", "0.3.3", "0.3.3-stable"]
  workflow_dispatch:

jobs:
  java-core-tests:
    name: Java Tests (Core, IFC, CLI & MCP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core, IFC, CLI & MCP tests
        working-directory: bim-portal/Java_client
        run: ./gradlew :hackathon-template:test --console=plain

      - name: Upload JUnit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-report
          path: bim-portal/Java_client/hackathon-template/build/reports/tests/test/

  docs-build:
    name: Build Astro Starlight Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build documentation site
        working-directory: website
        run: npm run build
