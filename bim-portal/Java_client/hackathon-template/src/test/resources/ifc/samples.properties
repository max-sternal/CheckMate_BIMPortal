# Sample IFC models for the IFC reading tests, one per line: path under test-models/ = download URL.
# `./gradlew :hackathon-template:downloadTestModels` fetches the missing ones (about 5 MB).
# Not in git: the buildingSMART certification datasets carry no license for redistribution.
#
# IFC2X3: andrewisen/bim-whale-ifc-samples (MIT). Its AdvancedProject.ifc is left out (44 MB).
ifc2x3/LargeBuilding.ifc=https://raw.githubusercontent.com/andrewisen/bim-whale-ifc-samples/main/LargeBuilding/IFC/LargeBuilding.ifc
# IFC4 and IFC4X3: buildingSMART/Certification-datasets, Simple-Scene. The same scenes in both
# schemas: a bridge (like the Ingenieurbau LOINs) and a building with windows and doors.
ifc4/Infra-Bridge.ifc=https://raw.githubusercontent.com/buildingSMART/Certification-datasets/main/IFC%204.0.2.1%20(IFC%204%20ADD2%20TC1)/Simple-Scene/Infra-Bridge.ifc
ifc4/Building-Architecture.ifc=https://raw.githubusercontent.com/buildingSMART/Certification-datasets/main/IFC%204.0.2.1%20(IFC%204%20ADD2%20TC1)/Simple-Scene/Building-Architecture.ifc
ifc4x3/Infra-Bridge.ifc=https://raw.githubusercontent.com/buildingSMART/Certification-datasets/main/IFC%204.3.2.0%20(IFC%204.3%20ADD2)/Simple-Scene/Infra-Bridge.ifc
ifc4x3/Building-Architecture.ifc=https://raw.githubusercontent.com/buildingSMART/Certification-datasets/main/IFC%204.3.2.0%20(IFC%204.3%20ADD2)/Simple-Scene/Building-Architecture.ifc
